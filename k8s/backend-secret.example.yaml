# Copy this file to backend-secret.yaml (gitignored - see repo root .gitignore)
# and replace the placeholder values before `kubectl apply -f backend-secret.yaml`.
# Never commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: kejaapp
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net"
  JWT_SECRET: "replace-with-a-long-random-secret"
  S3_ACCESS_KEY_ID: "replace-with-your-s3-access-key-id"
  S3_SECRET_ACCESS_KEY: "replace-with-your-s3-secret-access-key"
