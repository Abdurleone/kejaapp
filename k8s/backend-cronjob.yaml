apiVersion: batch/v1
kind: CronJob
metadata:
  name: jakezapp-backend-jobs
  namespace: jakezapp
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backend-jobs
              image: ghcr.io/abdurleone/jakezapp-backend:latest
              command: ["node", "scripts/runScheduledJobs.js"]
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
