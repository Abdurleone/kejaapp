apiVersion: apps/v1
kind: Deployment
metadata:
  name: jakezapp-backend
  namespace: jakezapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jakezapp
      component: backend
  template:
    metadata:
      labels:
        app: jakezapp
        component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/abdurleone/jakezapp-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jakezapp-backend
  namespace: jakezapp
spec:
  selector:
    app: jakezapp
    component: backend
  ports:
    - port: 80
      targetPort: 5000
