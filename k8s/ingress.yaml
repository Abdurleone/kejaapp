# Assumes ingress-nginx is installed in the cluster. No TLS configured here -
# for real use, add cert-manager + a ClusterIssuer and tls: blocks per host.
#
# Two hosts (not one host with /api path-based routing) because the frontend
# bundle bakes VITE_API_BASE_URL in at build time (see frontend/Dockerfile) -
# ghcr.io/abdurleone/jakezapp-frontend:latest is built expecting
# https://api.jakezapp.example.com. Using your own domain means rebuilding
# that image with your own --build-arg VITE_API_BASE_URL (see docs/dev/devops.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jakezapp
  namespace: jakezapp
spec:
  ingressClassName: nginx
  rules:
    - host: jakezapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jakezapp-frontend
                port:
                  number: 80
    - host: api.jakezapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jakezapp-backend
                port:
                  number: 80
