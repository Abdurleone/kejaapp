services:
  # A second, fully independent Render Blueprint from render.yaml
  # (production) - create this as its own Blueprint instance in Render's
  # dashboard (New > Blueprint), pointed at this file instead of the
  # default render.yaml (an "Advanced" option at Blueprint-creation time -
  # verify its exact current location in Render's UI). Production's
  # render.yaml/kejaapp-backend service is completely untouched by this
  # file. See docs/dev/Deployment.md's "Demo environment" section.
  - type: web
    name: kejaapp-demo
    runtime: docker
    dockerfilePath: backend/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_REQUIRED
        value: "true"
      # A SEPARATE MongoDB Atlas connection string from production's - never
      # point this at the same cluster/database render.yaml's kejaapp-backend
      # uses. Create a new, dedicated free-tier (M0) Atlas database for this.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: kejaapp-demo
      # Own independent secret - generateValue: true, never shared with
      # production's JWT_SECRET (a leaked demo secret must not compromise
      # production sessions, and vice versa).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: lax
      # PLACEHOLDER - Render will assign this service its own subdomain,
      # which will almost certainly NOT be exactly "kejaapp-demo.onrender.com"
      # (render.yaml's own history: "kejaapp-backend" was already taken
      # globally, Render assigned "kejaapp-backend-7iu3" instead - see that
      # file's VITE_API_BASE_URL comment). Deploy once, see what Render
      # actually assigns, then correct both of these two values below and
      # redeploy - until corrected, CORS and the built frontend's own API
      # calls will fail.
      - key: CORS_ORIGIN
        value: https://kejaapp-demo.onrender.com
      - key: VITE_API_BASE_URL
        value: https://kejaapp-demo.onrender.com
      # Public by nature either way; harmless to leave blank (the Google
      # button just won't render) if not set up for this deployment.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # Drives the frontend's "this is a demo" banner (frontend/src/App.jsx).
      - key: VITE_DEMO_MODE
        value: "true"
      # Demo-only safety gate - see backend/config/env.js's demoMode,
      # backend/scripts/resetDemoData.js, and backend/controllers/
      # demoController.js. Must NEVER be set on the production render.yaml
      # service - both the CLI reset script and the reset endpoint refuse to
      # do anything destructive unless this is exactly "true".
      - key: DEMO_MODE
        value: "true"
      # Long random secret, generated by the account owner (e.g.
      # `openssl rand -hex 32`) and pasted into Render's dashboard - never
      # committed. Gates POST /api/demo/reset/:secret the same way
      # MPESA_CALLBACK_SECRET gates the M-Pesa callback route.
      - key: DEMO_RESET_SECRET
        sync: false

      # Deliberately absent, all per the "empty = disabled" convention
      # already established in backend/config/env.js - keeps this a
      # $0-infrastructure, minimal-footprint demo with no duplicated real
      # secrets exposed on a more publicly-poked-at deployment:
      #   - REDIS_URL:            rate limiting/caching fall back to in-memory
      #   - STORAGE_DRIVER/S3_*:  unset -> local disk uploads (ephemeral
      #     across restarts - fine, arguably desirable, for a demo)
      #   - GOOGLE_CLIENT_ID:     POST /api/auth/google 503s instead of trying
      #   - SENTRY_DSN:           errors only logged locally, not reported
      #   - VAPID_*:              web push disabled
      #   - MPESA_*:              support-payment STK push disabled
      # No kejaapp-redis-equivalent keyvalue service is declared in this
      # file at all.
