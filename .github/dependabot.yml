version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # eslint-plugin-react's peer range tops out at eslint ^9.7 - a major
      # bump here has broken `npm install`/lint twice already (each time
      # unnoticed until manually caught, since CI is currently disabled).
      # Remove this once eslint-plugin-react/eslint-config-expo publish
      # eslint@10+ support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile-dependencies:
        patterns: ["*"]
    ignore:
      # Same eslint-plugin-react peer-range issue as frontend, plus:
      # @react-native/jest-preset (tied to this RN version) pins
      # babel-jest/jest-environment-node to ^29.7.0, incompatible with
      # jest@30's internal module-mocker API. Both have already regressed
      # twice via an auto-merged Dependabot group bump; ignored here rather
      # than relying on manual vigilance a third time.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      # @react-native-async-storage/async-storage's major version is tied
      # to the installed Expo SDK (`npx expo install --check` is the source
      # of truth, not semver) - a major-version group bump (#157) landed
      # 3.1.1 against an SDK 57 project expecting 2.2.0, breaking AsyncStorage
      # at runtime ("Native module is null") with zero test-suite signal,
      # since the test suite mocks AsyncStorage entirely. Unnoticed until a
      # live emulator run surfaced it, since CI is currently disabled.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
      # Same class of issue as async-storage above: @sentry/react-native's
      # version is tied to the installed Expo SDK, not semver. `npx expo
      # install` resolves ~7.11.0 as correct for Expo SDK 57; a
      # mobile-dependencies group bump (PR #234) tried to carry it to 8.22.0
      # bundled alongside 11 unrelated safe patch/minor updates - caught only
      # by manually reading the PR diff during a QA/QC pass, since CI is
      # disabled and the test suite has no way to detect an SDK-incompatible
      # native module version. Widened from major-only to all update types
      # after PR #288 tried a plain *minor* bump (7.11.0 -> 7.13.0) - expo's
      # own devDependencies pin this exact version, not a range.
      - dependency-name: "@sentry/react-native"
      # react-native itself is the same class of issue again, but this time
      # it broke on a plain MINOR bump, not just a major one: a
      # mobile-dependencies group bump (PR #269) carried it 0.86.2 -> 0.87.0,
      # one version past what the installed Expo SDK 57 actually bundles
      # (`expo`'s own devDependencies pin react-native@0.86.2 exactly, and
      # `npx expo-doctor` flagged the mismatch immediately once run). This
      # broke `jest`/`expo-doctor` outright from a clean install - not a
      # subtle runtime bug, a total inability to run the test suite at all -
      # yet 986 tests kept "passing" for two more merged PRs afterward
      # because nobody re-ran a truly clean `npm ci` in between (CI is
      # disabled; local node_modules kept a stale, still-working resolution
      # from before the bump). Caught only by a QA/QC pass that did a clean
      # reinstall. react-native isn't semver-compatible across Expo SDK
      # boundaries the way most packages are, so ignore it here entirely -
      # bump it only via `npx expo install --fix` alongside an SDK upgrade.
      - dependency-name: "react-native"
      # The very next mobile-dependencies group bump after the react-native
      # fix above (PR #288) proved the problem was never just react-native:
      # it left react-native pinned (protected by the rule above) but bumped
      # everything *around* it - react/react-dom, react-native-reanimated,
      # react-native-safe-area-context, react-native-screens,
      # react-native-svg, react-native-worklets, @react-native/jest-preset -
      # back past what Expo SDK 57 actually bundles, plus typescript to a
      # major version (7.0.2) `@typescript-eslint/eslint-plugin` doesn't
      # support at all. Verified directly: that PR broke `jest` completely
      # (38/38 suites failed, 0/216 tests ran) and crashed `npm run lint`
      # outright ("typescript-eslint does not support TS 7.0"). All of these
      # are either Expo-SDK-bundle-tied (first group) or peer-range-tied to
      # a specific typescript major (last one) - ignored here entirely for
      # the same reason as react-native above, rather than adding each one
      # back individually the next time a group bump tries it again.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-worklets"
      - dependency-name: "@react-native/jest-preset"
      - dependency-name: "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
