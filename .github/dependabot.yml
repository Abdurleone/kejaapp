version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # eslint-plugin-react's peer range tops out at eslint ^9.7 - a major
      # bump here has broken `npm install`/lint twice already (each time
      # unnoticed until manually caught, since CI is currently disabled).
      # Remove this once eslint-plugin-react/eslint-config-expo publish
      # eslint@10+ support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile-dependencies:
        patterns: ["*"]
    ignore:
      # Same eslint-plugin-react peer-range issue as frontend, plus:
      # @react-native/jest-preset (tied to this RN version) pins
      # babel-jest/jest-environment-node to ^29.7.0, incompatible with
      # jest@30's internal module-mocker API. Both have already regressed
      # twice via an auto-merged Dependabot group bump; ignored here rather
      # than relying on manual vigilance a third time.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      # @react-native-async-storage/async-storage's major version is tied
      # to the installed Expo SDK (`npx expo install --check` is the source
      # of truth, not semver) - a major-version group bump (#157) landed
      # 3.1.1 against an SDK 57 project expecting 2.2.0, breaking AsyncStorage
      # at runtime ("Native module is null") with zero test-suite signal,
      # since the test suite mocks AsyncStorage entirely. Unnoticed until a
      # live emulator run surfaced it, since CI is currently disabled.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
      # Same class of issue as async-storage above: @sentry/react-native's
      # major version is tied to the installed Expo SDK, not semver. `npx
      # expo install` resolves ~7.11.0 as correct for Expo SDK 57; a
      # mobile-dependencies group bump (PR #234) tried to carry it to 8.22.0
      # bundled alongside 11 unrelated safe patch/minor updates - caught only
      # by manually reading the PR diff during a QA/QC pass, since CI is
      # disabled and the test suite has no way to detect an SDK-incompatible
      # native module version.
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
