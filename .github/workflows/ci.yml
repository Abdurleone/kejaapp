name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-enough-length
          MONGODB_URI: mongodb://127.0.0.1:27017
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
          TEST_MONGODB_DB_NAME: kejaapp_ci
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Run tests
        working-directory: mobile
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t kejaapp-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t kejaapp-frontend:ci ./frontend

  k8s-smoke-test:
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - uses: actions/checkout@v7

      - name: Install kind
        run: |
          curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64"
          chmod +x /usr/local/bin/kind

      # extraPortMappings + the ingress-ready label are required for
      # ingress-nginx's "kind" provider manifest to work at all.
      - name: Create kind cluster
        run: |
          cat <<'EOF' > /tmp/kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          EOF
          kind create cluster --name kejaapp-ci --config /tmp/kind-config.yaml

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          # rollout status polls until the Deployment exists and is Available;
          # `kubectl wait --for=condition=ready pod --selector=...` right after
          # apply can race pod creation and fail with "no matching resources".
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s

      # http (not https) because there's no TLS in this cluster - unlike the
      # publish job's frontend build below, which targets the real ingress.
      - name: Build images
        run: |
          docker build -t kejaapp-backend:ci-smoke ./backend
          docker build --build-arg VITE_API_BASE_URL=http://api.kejaapp.example.com \
            -t kejaapp-frontend:ci-smoke ./frontend

      - name: Load images into kind
        run: kind load docker-image kejaapp-backend:ci-smoke kejaapp-frontend:ci-smoke --name kejaapp-ci

      # ConfigMap/Secret/Mongo here are smoke-test-only stand-ins for the real
      # backend-config/backend-secret + MongoDB Atlas used in an actual
      # deployment (see docs/devops.md) - STORAGE_DRIVER=local and a
      # throwaway in-cluster Mongo avoid needing real S3/Atlas credentials in CI.
      - name: Apply k8s manifests with smoke-test overrides
        run: |
          kubectl apply -f k8s/namespace.yaml

          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: backend-config
            namespace: kejaapp
          data:
            NODE_ENV: production
            DB_REQUIRED: "true"
            MONGODB_DB_NAME: kejaapp
            JWT_EXPIRES_IN: 7d
            TRUST_PROXY: "1"
            AUTH_COOKIE_SECURE: "false"
            CORS_ORIGIN: http://kejaapp.example.com
            STORAGE_DRIVER: local
            REDIS_URL: redis://kejaapp-redis:6379
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: backend-secret
            namespace: kejaapp
          type: Opaque
          stringData:
            MONGODB_URI: "mongodb://mongo-ci.kejaapp.svc.cluster.local:27017"
            JWT_SECRET: "ci-smoke-test-secret-not-for-real-use"
            S3_ACCESS_KEY_ID: ""
            S3_SECRET_ACCESS_KEY: ""
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mongo-ci
            namespace: kejaapp
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mongo-ci
            template:
              metadata:
                labels:
                  app: mongo-ci
              spec:
                containers:
                  - name: mongo
                    image: mongo:7
                    ports:
                      - containerPort: 27017
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mongo-ci
            namespace: kejaapp
          spec:
            selector:
              app: mongo-ci
            ports:
              - port: 27017
          EOF

          # Without this, the backend's Deployment (applied next) starts racing
          # Mongo's own startup, and its livenessProbe kills the pod before
          # Mongo's first reachable - a real restart loop reproduced locally
          # while building this job, not a hypothetical. 180s because a cold
          # mongo:7 pull (~290MB, uncached on a fresh cluster) alone measured
          # ~1m45s locally, blowing past a tighter timeout on its own.
          kubectl -n kejaapp rollout status deployment/mongo-ci --timeout=180s

          kubectl apply -f k8s/redis-statefulset.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Point Deployments at the locally built images
        run: |
          kubectl -n kejaapp patch deployment kejaapp-backend --type=json -p='[
            {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"kejaapp-backend:ci-smoke"},
            {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}
          ]'
          kubectl -n kejaapp patch deployment kejaapp-frontend --type=json -p='[
            {"op":"replace","path":"/spec/template/spec/containers/0/image","value":"kejaapp-frontend:ci-smoke"},
            {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}
          ]'

      - name: Wait for rollout
        run: |
          kubectl -n kejaapp rollout status deployment/kejaapp-backend --timeout=120s
          kubectl -n kejaapp rollout status deployment/kejaapp-frontend --timeout=90s

      - name: Verify through the ingress
        run: |
          echo "127.0.0.1 kejaapp.example.com api.kejaapp.example.com" | sudo tee -a /etc/hosts

          echo "-- backend health --"
          curl -sSf http://api.kejaapp.example.com/api/health | tee /tmp/health.json
          python3 -c "import json; d=json.load(open('/tmp/health.json')); assert d['database']['status']=='connected', d"

          echo "-- frontend --"
          curl -sSf -o /dev/null -w "HTTP %{http_code}\n" http://kejaapp.example.com/

          echo "-- register + create property + public discovery --"
          TOKEN=$(curl -sSf -X POST http://api.kejaapp.example.com/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Smoke Test","email":"ci-smoke@example.com","password":"password123","role":"landlord"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -sSf -X POST http://api.kejaapp.example.com/api/properties \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d '{"title":"CI Smoke Test Listing","price":{"rent":1000},"listedBy":"owner"}' > /dev/null
          curl -sSf http://api.kejaapp.example.com/api/properties \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['data']) >= 1, d"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n kejaapp get pods -o wide
          kubectl -n kejaapp describe pods
          kubectl -n kejaapp logs -l component=backend --tail=100 || true
          kubectl -n kejaapp logs -l component=frontend --tail=100 || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name kejaapp-ci

  publish:
    runs-on: ubuntu-latest
    needs: [docker, k8s-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/kejaapp-backend:latest \
            -t ghcr.io/${{ github.repository_owner }}/kejaapp-backend:${{ github.sha }} \
            ./backend
          docker push ghcr.io/${{ github.repository_owner }}/kejaapp-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/kejaapp-backend:${{ github.sha }}

      # VITE_API_BASE_URL is baked into the static bundle at build time, so this
      # published image only serves the example api.kejaapp.example.com host
      # used in k8s/ingress.yaml. Deploying to a different domain means
      # rebuilding this image locally with your own --build-arg (see
      # docs/devops.md's Kubernetes section).
      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.kejaapp.example.com \
            -t ghcr.io/${{ github.repository_owner }}/kejaapp-frontend:latest \
            -t ghcr.io/${{ github.repository_owner }}/kejaapp-frontend:${{ github.sha }} \
            ./frontend
          docker push ghcr.io/${{ github.repository_owner }}/kejaapp-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/kejaapp-frontend:${{ github.sha }}
