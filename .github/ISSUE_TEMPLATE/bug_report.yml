name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much
        of this as you can — it makes the issue much faster to reproduce
        and fix.

        Found a security vulnerability instead? Please don't file it here —
        see [SECURITY.md](https://github.com/Abdurleone/kejaapp/blob/main/SECURITY.md)
        for how to report it privately.

  - type: checkboxes
    attributes:
      label: Checked for existing issues
      description: Please search open and closed issues before filing a new one.
      options:
        - label: I searched and didn't find an existing issue for this.
          required: true

  - type: dropdown
    attributes:
      label: Where does this happen?
      multiple: true
      options:
        - Backend API
        - Web frontend
        - Mobile app (Expo)
        - Not sure / other
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: How can we see this ourselves?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: |
        - Web: browser + OS (e.g. Chrome 128 on macOS 15)
        - Mobile: Expo Go / dev build, iOS or Android, device or simulator
        - Backend: Node version, OS, local vs. hosted MongoDB
      placeholder: |
        - Browser/device: ...
        - OS: ...
        - Node version (if backend): ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Logs, screenshots, or error messages
      description: Paste any relevant console output, server logs, or screenshots. This will be formatted as code automatically.
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else?
      description: Additional context that might help (e.g. only happens for a specific role, only on a fresh account, etc).
    validations:
      required: false
