services:
  # A single service now: this image bundles the built frontend alongside
  # the backend (backend/Dockerfile.render, app.js serves it when present),
  # so the web app and its API are the same origin - no more relaying the
  # CSRF token through response bodies to work around a cookie a different
  # origin couldn't see (see docs/project/CHANGELOG.md's "Consolidate Web + API onto One
  # Render Origin" entry). A separate jakezapp-frontend static site used to
  # exist here; it's retired, not just renamed - jakezapp-backend's own URL
  # (whatever Render assigns it) is now the one public URL for everything.
  - type: web
    name: jakezapp-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_REQUIRED
        value: "true"
      - key: MONGODB_URI
        sync: false
      # Deliberately LEFT AS "kejaapp", not renamed to match the JakezApp
      # rebrand: MONGODB_URI (above) is a bare cluster host with no database
      # path, so this is the only thing selecting which Atlas database the
      # app actually reads/writes (see config/env.js's normalizeMongoUri -
      # it only ever falls back to this value when the URI's own path is
      # empty). Every real production user/property/inquiry already lives in
      # the "kejaapp" database - changing this value would silently point
      # production at a brand-new, empty database on the next deploy, not
      # rename or migrate the existing one. The database name is an internal
      # identifier, invisible to users; there's no product reason to rename
      # it, and real reasons not to. If this ever needs to genuinely change,
      # that's a deliberate data migration (mongodump/mongorestore into a
      # real "jakezapp" database), not a config edit.
      - key: MONGODB_DB_NAME
        value: kejaapp
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Same-site now that frontend and API share an origin - independent of
      # AUTH_COOKIE_SECURE (still "true"; still HTTPS) on purpose, see
      # env.js's authCookieSameSite comment. Leaving this unset anywhere else
      # (docker-compose, Kubernetes) preserves those deployments' existing
      # cross-origin "none" behavior exactly.
      - key: AUTH_COOKIE_SAME_SITE
        value: lax
      # Still needed even though this is now same-origin: Vite's build emits
      # `crossorigin` on the module <script>/<link rel=stylesheet> tags,
      # which makes the browser send a real Origin header (CORS mode) for
      # these same-origin requests too - confirmed live, a plain "no Origin
      # header = same-origin, always allow" assumption isn't enough on its
      # own. Self-referential now: this same host is both the page's origin
      # and the API's.
      - key: CORS_ORIGIN
        value: https://jakezapp-backend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: jakezapp-redis
          type: keyvalue
          property: connectionString
      # Build-time only (backend/Dockerfile.render's frontend-build stage
      # declares matching ARGs) - Vite bakes these into the JS bundle when
      # `npm run build` runs, not read at container start. Self-referential
      # now: this same host serves both the page and the API it calls.
      # "jakezapp-backend" was already taken by another Render user globally
      # (Render subdomains are unique across all accounts, not just yours),
      # so Render assigned this real deployment "jakezapp-backend-7iu3"
      # instead - update this if the service is ever recreated under a
      # different assigned name.
      - key: VITE_API_BASE_URL
        value: https://jakezapp-backend.onrender.com
      # Public by nature (baked into the built JS bundle either way), but
      # left as sync: false rather than a literal value here since it's set
      # once in Google Cloud Console and may not exist yet on a fresh clone.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: keyvalue
    name: jakezapp-redis
    plan: free
    ipAllowList: []

# Malware scanning (ClamAV) is deliberately not included here - it needs
# ~1-2GB RAM, well past Render's free plan, making it the one piece of this
# stack that isn't free to run. CLAMAV_HOST is left unset, so
# malwareScanService.js's existing "empty = disabled" convention silently
# skips scanning uploads rather than erroring. Add a `pserv` service on a
# paid plan (see docker-compose.yml's `clamav` service for the image/config)
# if you want scanning back on this free deployment path.
