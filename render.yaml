services:
  - type: web
    name: kejaapp-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_REQUIRED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: kejaapp
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        value: https://kejaapp-frontend.onrender.com
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: kejaapp-redis
          type: keyvalue
          property: connectionString

  - type: web
    name: kejaapp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://kejaapp-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: kejaapp-redis
    plan: free
    ipAllowList: []

# Malware scanning (ClamAV) is deliberately not included here - it needs
# ~1-2GB RAM, well past Render's free plan, making it the one piece of this
# stack that isn't free to run. CLAMAV_HOST is left unset, so
# malwareScanService.js's existing "empty = disabled" convention silently
# skips scanning uploads rather than erroring. Add a `pserv` service on a
# paid plan (see docker-compose.yml's `clamav` service for the image/config)
# if you want scanning back on this free deployment path.
