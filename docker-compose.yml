services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Bound to loopback only - this container has no auth enabled, so
    # publishing it on 0.0.0.0 (Docker's default without a host IP prefix)
    # would expose the entire database, unauthenticated, to anything that
    # can reach this host's public IP. The backend reaches Mongo over the
    # compose network (mongodb://mongo:27017) regardless; this mapping only
    # exists so a local client (mongosh/Compass) can connect from the host.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: clamscan --version
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_REQUIRED: "true"
      MONGODB_URI: mongodb://mongo:27017
      # Deliberately "kejaapp", not renamed for the JakezApp rebrand - see
      # config/env.js's mongoDbName comment. A persistent docker-compose
      # Mongo volume from before the rename already has data under this name.
      MONGODB_DB_NAME: kejaapp
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a .env file next to docker-compose.yml}
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    ports:
      - "5000:5000"
    healthcheck:
      test: wget -qO- http://localhost:5000/api/health/live || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: wget -qO- http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo-data:
  redis-data:
  clamav-data:
  backend-uploads:
  backend-logs:
